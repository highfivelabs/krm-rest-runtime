# A kind, then two drafts (generated by krmgen.py's drafts.py for Terraform
# types no kind covers): one at the kind's own item path, which the fake must
# not route, and one with no API at all. Then a kind after them.
vendor: example
connection: {group: core.example.hfl.dev, version: v1alpha1, kind: Connection}
kinds:
- kind: Widget
  group: things.example.hfl.dev
  version: v1alpha1
  plural: widgets
  shape: crud
  create: {method: POST, path: "/orgs/{org}/widgets"}
  read: {method: GET, path: "/orgs/{org}/widgets/{widget_id}"}
  update: {method: PATCH, path: "/orgs/{org}/widgets/{widget_id}"}
  delete: {method: DELETE, path: "/orgs/{org}/widgets/{widget_id}"}
  params: [{name: org, field: org}]
  id: {param: widget_id, from: id}
  sample: {org: acme, name: w1}
- kind: WidgetAssignment
  group: things.example.hfl.dev
  version: v1alpha1
  plural: widgetassignments
  shape: upsert
  read: {method: GET, path: "/orgs/{org}/widgets"}
  update: {method: PUT, path: "/orgs/{org}/widgets/{assignee}"}
  params: [{name: org, field: org}]
  terraform: [example_widget_assignment]
  sample: {org: acme, assignee: example-assignee}
  readiness: draft
  draft:
    open:
    - "read: no GET on the item path /orgs/{org}/widgets/{assignee}; found only in a list (GET /orgs/{org}/widgets)"
    - "delete: no DELETE on the item path /orgs/{org}/widgets/{assignee}"
    candidates: ["GET POST /orgs/{org}/widgets"]
- kind: Trigger
  group: event.example.hfl.dev
  version: v1alpha1
  plural: triggers
  shape: crud
  read: {method: GET, path: ""}
  terraform: [example_event_trigger]
  readiness: draft
  draft:
    open: ["no API in spec: no path has the words event, trigger"]
- kind: Gadget
  group: things.example.hfl.dev
  version: v1alpha1
  plural: gadgets
  shape: crud
  create: {method: POST, path: "/orgs/{org}/gadgets"}
  read: {method: GET, path: "/orgs/{org}/gadgets/{gadget_id}"}
  update: {method: PATCH, path: "/orgs/{org}/gadgets/{gadget_id}"}
  delete: {method: DELETE, path: "/orgs/{org}/gadgets/{gadget_id}"}
  params: [{name: org, field: org}]
  id: {param: gadget_id, from: id}
  sample: {org: acme, name: g1}
